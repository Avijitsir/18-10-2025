<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group-based study planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%; max-width: 900px; margin: 0 auto;
            background-color: #ffffff; border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08); padding: 20px;
        }
        h1, h2 { text-align: center; color: #333; }
        h1 { font-size: 26px; }

        /* --- Group Selection --- */
        #group-selection .group-button {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            font-size: 18px; font-weight: 600; color: #fff;
            background-image: linear-gradient(45deg, #007BFF, #0056b3);
            border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
        }
        #group-selection .group-button:hover {
            transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        /* --- Calendar View --- */
        #schedule-view { display: none; }
        .back-button {
            background-color: #6c757d; color: white; border: none;
            padding: 8px 16px; border-radius: 5px; font-size: 16px; cursor: pointer;
        }
        .strategy-button {
            display: block; width: 100%; margin: 20px 0 10px 0;
            background-color: #28a745; color: white; padding: 12px;
            font-size: 16px; font-weight: 600; border: none;
            border-radius: 8px; cursor: pointer;
        }
        
        /* Calendar Styles */
        .month-header {
            display: flex; justify-content: space-between; align-items: center;
            margin: 20px 0;
        }
        .month-header button {
            background-color: #007BFF; color: white; border: none;
            padding: 8px 14px; border-radius: 5px; font-size: 18px; cursor: pointer;
        }
        #current-month-year { font-size: 22px; font-weight: 600; color: #0056b3;}

        #calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;
        }
        .day-name { font-weight: 700; background-color: #e9ecef; text-align: center; padding: 10px; border-radius: 6px;}
        .calendar-day {
            min-height: 70px; background-color: #f8f9fa; border: 1px solid #dee2e6;
            display: flex; flex-direction: column; justify-content: flex-start;
            align-items: center; transition: background-color 0.2s; padding: 5px;
            border-radius: 6px;
        }
        .calendar-day.empty { background-color: transparent; border: none; }
        .calendar-day.today { border: 2px solid #007BFF; }
        .calendar-day.has-event { cursor: pointer; }
        .calendar-day.future-event { background-color: #e7f3ff; color: #0056b3; }
        .calendar-day.past-event {
            background-color: #e9f7ef;
            color: #155724;
        }
        .calendar-day.past-event::after {
            content: '✔'; color: #28a745; font-size: 18px; margin-top: auto;
        }

        /* --- Modal (Strategy & Topic) --- */
        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            overflow: auto; background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fefefe; margin: 5% auto; padding: 25px;
            border: 1px solid #888; width: 90%; max-width: 700px;
            border-radius: 10px; position: relative;
        }
        .close-button {
            color: #aaa; position: absolute; top: 10px; right: 20px;
            font-size: 28px; font-weight: bold; cursor: pointer;
        }
        .strategy-content h3 { color: #0056b3; border-bottom: 2px solid #007BFF; padding-bottom: 5px; }
        .strategy-content ul { list-style-type: '✓  '; padding-left: 20px; }

        /* Topic Modal-এর ভেতরের লেখার স্টাইল */
        #topic-modal-content {
            font-size: 16px;
            line-height: 1.7;
            color: #333;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 15px; 
        }
        #topic-modal-content strong {
            color: #0056b3; 
        }

        /* === লিঙ্কের (a) স্টাইল === */
        #topic-modal-content a {
            text-decoration: none;  /* আন্ডারলাইন নেই */
            color: inherit;         /* ভেতরের লেখার কালার ব্যবহার করো */
            font-weight: 700;     /* লিঙ্কগুলোকেও বোল্ড রাখো */
        }
        #topic-modal-content a:hover {
            text-decoration: underline;
        }
        /* ======================== */


        /* === বিষয়ভিত্তিক কালার ক্লাস === */
        .sub-bio {
            color: #28a745; /* সবুজ */
            font-weight: 700;
        }
        .sub-phy {
            color: #007BFF; /* নীল */
            font-weight: 700;
        }
        .sub-econ {
            color: #dc3545; /* লাল */
            font-weight: 700;
        }
        .sub-gk {
            color: #6d4c02; /* বাদামী */
            font-weight: 700;
        }
        .sub-reas {
            color: #6f42c1; /* বেগুনি */
            font-weight: 700;
        }
        .sub-math {
            color: #fd7e14; /* কমলা */
            font-weight: 700;
        }
        /* ============================ */


        @media (max-width: 768px) {
            h1 { font-size: 22px; }
            #current-month-year { font-size: 18px; }
            .day-name { font-size: 12px; padding: 8px 2px; }
            .calendar-day { min-height: 50px; }
            .modal-content { margin: 10% auto; padding: 20px;}
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="group-selection">
            <h1>আপনার গ্রুপ বেছে নিন</h1>
        </div>

        <div id="schedule-view">
            <button class="back-button" onclick="showGroupSelection()">&larr; পিছনে যান</button>
            <h2 id="group-title"></h2>
            <button class="strategy-button" onclick="openStrategyModal()">সম্পূর্ণ বছরের স্ট্র্যাটেজি দেখুন</button>

            <div class="month-header">
                <button id="prev-month">&laquo; আগের মাস</button>
                <span id="current-month-year"></span>
                <button id="next-month">পরের মাস &raquo;</button>
            </div>
            <div id="calendar-grid"></div>
        </div>
    </div>

    <div id="strategy-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeStrategyModal()">&times;</span>
            <h2 id="strategy-modal-title">বার্ষিক প্রস্তুতি স্ট্র্যাটেজি</h2>
            <div id="strategy-content-container"></div>
        </div>
    </div>

    <div id="topic-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeTopicModal()">&times;</span>
            <h2 id="topic-modal-title"></h2>
            <div id="topic-modal-content"></div>
            </div>
    </div>

    <script>
        // --- গ্লোবাল ভেরিয়েবল ---
        
        // এটি আপনার schedule.json ফাইলের সঠিক লিঙ্ক। এটি পরিবর্তন করার দরকার নেই।
        const dataUrl = 'schedule.json'; 

        let allScheduleData = {}; // সমস্ত রুটিন ডেটা এখানে লোড হবে
        let allStrategyData = {}; // সমস্ত স্ট্র্যাটেজি ডেটা এখানে লোড হবে

        // --- DOM এলিমেন্ট ---
        const groupSelectionView = document.getElementById('group-selection');
        const scheduleView = document.getElementById('schedule-view');
        const groupTitle = document.getElementById('group-title');
        const calendarGrid = document.getElementById('calendar-grid');
        const currentMonthYearSpan = document.getElementById('current-month-year');
        const modal = document.getElementById('strategy-modal');
        const topicModal = document.getElementById('topic-modal');
        const topicModalTitle = document.getElementById('topic-modal-title');
        const topicModalContent = document.getElementById('topic-modal-content');

        let currentGroup = '';
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        
        // --- ক্যালেন্ডার রেন্ডার ফাংশন ---
        function renderCalendar(month, year) {
            calendarGrid.innerHTML = '';
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            currentMonthYearSpan.textContent = new Date(year, month).toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' });
            
            const dayNames = ['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহঃ', 'শুক্র', 'শনি'];
            dayNames.forEach(day => { 
                const el = document.createElement('div'); 
                el.className = 'day-name'; 
                el.textContent = day; 
                calendarGrid.appendChild(el); 
            });

            for (let i = 0; i < firstDay; i++) { 
                calendarGrid.appendChild(document.createElement('div')).className = 'calendar-day empty'; 
            }

            const today = new Date(); 
            today.setHours(0, 0, 0, 0);
            
            const groupSchedule = allScheduleData[currentGroup] || [];
            const groupEvents = groupSchedule.reduce((acc, event) => ({...acc, [event.date]: event.topic}), {});

            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.innerHTML = `<span class="day-number">${day}</span>`;
                
                const date = new Date(year, month, day); 
                date.setHours(0, 0, 0, 0);
                
                if (date.getTime() === today.getTime()) { 
                    dayCell.classList.add('today'); 
                }
                
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (groupEvents[dateString]) {
                    dayCell.classList.add('has-event', date < today ? 'past-event' : 'future-event');
                    dayCell.onclick = () => {
                        const topicText = groupEvents[dateString];
                        const formattedDate = date.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
                        
                        topicModalTitle.textContent = `পড়াশোনার বিষয়: ${formattedDate}`;
                        topicModalContent.innerHTML = formatTopicText(topicText);
                        topicModal.style.display = "block";
                    };
                }
                calendarGrid.appendChild(dayCell);
            }
        }

        // --- Helper ফাংশন ---
        function changeMonth(offset) {
            currentMonth += offset;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
            else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentMonth, currentYear);
        }

        function showGroupSchedule(groupName) {
            currentGroup = groupName;
            groupSelectionView.style.display = 'none'; 
            scheduleView.style.display = 'block';
            groupTitle.textContent = `${groupName} - স্টাডি ক্যালেন্ডার`;
            renderCalendar(currentMonth, currentYear);
        }

        function showGroupSelection() { 
            scheduleView.style.display = 'none'; 
            groupSelectionView.style.display = 'block'; 
        }

        function openStrategyModal() {
            const groupStrategy = allStrategyData[currentGroup];
            if (!groupStrategy) { 
                alert("এই গ্রুপের জন্য কোনো স্ট্র্যাটেজি পাওয়া যায়নি।"); 
                return; 
            }
            const container = document.getElementById('strategy-content-container');
            container.innerHTML = '';
            document.getElementById('strategy-modal-title').textContent = groupStrategy.title;
            
            for (const monthRange in groupStrategy.plan) {
                const section = document.createElement('div');
                let listItems = groupStrategy.plan[monthRange].map(item => `<li>${item}</li>`).join('');
                section.innerHTML = `<h3>${monthRange}</h3><ul>${listItems}</ul>`;
                container.appendChild(section);
            }
            modal.style.display = "block";
        }

        function closeStrategyModal() { modal.style.display = "none"; }
        function closeTopicModal() { topicModal.style.display = "none"; }

        window.onclick = function(event) {
            if (event.target == modal) { closeStrategyModal(); }
            if (event.target == topicModal) { closeTopicModal(); }
        }

        function formatTopicText(text) {
            let html = text;
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/\_\*(.*?)\*\_/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
            html = html.replace(/\_(.*?)\_/g, '<em>$1</em>');
            return html;
        }

        // --- প্রধান ইনিশিয়ালাইজেশন ফাংশন ---
        async function initialize() {
            try {
                // নেটওয়ার্ক থেকে ডেটা লোড করুন
                // cache: 'no-cache' যোগ করা হলো যাতে সব সময় নতুন ডেটা আসে
                const response = await fetch(`${dataUrl}?v=${new Date().getTime()}`, { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error('ডেটা ফাইল লোড করা যায়নি।');
                }
                const data = await response.json();
                
                allScheduleData = data.scheduleData;
                allStrategyData = data.strategyData;
                
                // গ্রুপ বাটন তৈরি করুন
                groupSelectionView.innerHTML = '<h1>আপনার গ্রুপ বেছে নিন</h1>'; // পুরনো বাটন পরিষ্কার করুন
                Object.keys(allScheduleData).forEach(name => {
                    const button = document.createElement('button');
                    button.className = 'group-button'; 
                    button.textContent = name;
                    button.onclick = () => showGroupSchedule(name);
                    groupSelectionView.appendChild(button);
                });

            } catch (error) {
                console.error('Error loading schedule:', error);
                groupSelectionView.innerHTML = `<h1>ডেটা লোড করতে সমস্যা হয়েছে।</h1><p>দয়া করে আপনার '${dataUrl}' ফাইলের লিঙ্কটি ঠিক আছে কিনা দেখুন এবং ইন্টারনেট সংযোগ পরীক্ষা করুন।</p>`;
            }

            // শুধুমাত্র যে বাটনগুলির HTML-এ "onclick" নেই, সেগুলিকেই এখানে যোগ করা হলো
            document.getElementById('prev-month').onclick = () => changeMonth(-1);
            document.getElementById('next-month').onclick = () => changeMonth(1);
            
            // যে বাটনগুলির HTML-এ "onclick" আছে, সেগুলিকে আর এখানে যোগ করার দরকার নেই।
        }

        // অ্যাপলিকেশন শুরু করুন
        initialize();
    </script>
</body>
</html>
